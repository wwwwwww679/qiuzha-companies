name: 每日更新秋招企业库

on:
  schedule:
    # 每天北京时间 09:17 运行（GitHub Actions 使用 UTC，北京=UTC+8，故 01:17 UTC）
    - cron: "17 1 * * *"
  workflow_dispatch: {}   # 允许在 Actions 页面手动点「Run workflow」立即运行

permissions:
  contents: write        # 允许脚本把更新后的 companies.json / meta.json 提交回仓库

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 拉取完整历史，便于提交

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 运行更新脚本
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: python update_companies.py

      - name: 提交变更（仅在确有新增时）
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain)" ]; then
            git add companies.json meta.json
            git commit -m "chore: 每日自动更新秋招企业库 $(date +%F)"
            git push
            echo "已推送更新"
          else
            echo "今日无新增，跳过提交"
          fi
